[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepeval-scoring"
version = "0.1.0"
description = "DeepEval-based scoring system for apply_agent implementations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC"}
]
keywords = [
    "deepeval",
    "evaluation",
    "scoring",
    "llm",
    "code-quality",
    "simics",
    "dml"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# NOTE: This project depends on the local deepeval installation from ../deepeval
# Install deepeval first: cd ../deepeval && pip install -e .
dependencies = [
    "deepeval @ file:///${PROJECT_ROOT}/../deepeval",
    "openai>=1.0.0",
    "litellm>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0",
    "markdown>=3.0.0",
    "mlflow>=3.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
    "mypy>=1.0.0",
]

[project.scripts]
deepeval-score = "score:main"

[project.urls]
Homepage = "https://github.com/google/adk-python"
Repository = "https://github.com/google/adk-python"
Issues = "https://github.com/google/adk-python/issues"

[tool.setuptools]
packages = ["metrics", "evaluators", "parsers", "tracking"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.black]
line-length = 80
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 80
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.main]
# Use 2 spaces for indentation (Google style)
indent-string = "  "
max-line-length = 80

[tool.pylint.messages_control]
disable = [
    "C0103",  # Invalid name (we use snake_case)
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0212",  # Access to protected member
]

[tool.pylint.format]
max-line-length = 80
indent-string = "  "

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "f"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "deepeval.*",
    "litellm.*",
    "tree_sitter.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=metrics",
    "--cov=evaluators",
    "--cov=parsers",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["metrics", "evaluators", "parsers"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
