# MLflow Configuration for DeepEval Scoring

mlflow:
  # Tracking URI - can be overridden via CLI or environment variable
  # Use absolute path to avoid confusion about database location
  tracking_uri: "sqlite:///{{ PROJECT_ROOT }}/deepeval-scoring/mlflow.db"
  
  # Artifact root - controls where mlruns folder is created
  artifact_root: "{{ PROJECT_ROOT }}/deepeval-scoring/mlruns"
  
  # Experiment naming pattern
  experiment_naming: "{device_name}-evaluation"
  
  # Artifact logging settings
  auto_log_artifacts: true
  log_system_metrics: true
  
  # Default tags applied to all runs
  default_tags:
    project: "adk-python"
    component: "deepeval-scoring"
    framework: "deepeval"
  
  # Metric logging configuration
  metrics:
    log_component_scores: true
    log_timing_metrics: true
    log_model_metadata: true
    log_evaluation_details: true
  
  # Artifact configuration
  artifacts:
    log_raw_results: true
    log_session_logs: true
    log_config_files: true
    log_score_file: true  # Include the actual score.md file from workdir