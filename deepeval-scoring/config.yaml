# DeepEval Scoring Configuration

# Model settings
models:
  default: "iflow/qwen3-coder-plus"
  alternatives:
    - "github_copilot/gpt-4.1"
    - "openai/gpt-4"

# Metric thresholds
thresholds:
  code_correctness: 0.8
  test_coverage: 0.7
  code_style: 0.9
  documentation_usage: 0.8

# Scoring weights (must sum to 1.0)
weights:
  code_quality:
    build_success: 0.33      # 30/90
    test_pass_rate: 0.11     # 10/90
    dml_quality: 0.33        # 30/90
    test_quality: 0.22       # 20/90
  
  agent_behavior:
    documentation: 0.56      # 50/90
    efficiency: 0.33         # 30/90
    time: 0.11              # 10/90

# Report settings
report:
  format: "markdown"
  include_evidence: true
  include_code_snippets: true
  max_snippet_lines: 20
