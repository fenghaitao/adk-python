[project]
name = "llama_index-apps"
version = "1.0.0"
description = "Code graph (tree-sitter) and property graph using LlamaIndex"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # code-graph: tree-sitter based code hierarchy
    "llama-index-packs-code-hierarchy>=0.6.1",
    "tree-sitter-language-pack",
    "tree-sitter",
    "llama-index-readers-file>=0.5.0",
    # property-graph: LLM-based entity/relation extraction
    "llama-index-core>=0.13.0",
    "llama-index-llms-litellm>=0.6.3",
    "llama-index-embeddings-litellm>=0.4.1",
    # shared
    "litellm>=1.76.0",
    "numpy>=1.26.0,<2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
code-graph = "llama_index_apps.code_graph:main"
property-graph = "llama_index_apps.property_graph:main"

[tool.uv.sources]
litellm = { git = "https://github.com/fenghaitao/litellm.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
