[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dspy-openspec"
version = "0.1.0"
description = "DSPy-based OpenSpec implementation for Simics device development"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Google LLC"}
]
keywords = ["dspy", "openspec", "simics", "dml", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "dspy",
    "pyyaml>=6.0",
    "chromadb>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "pylint>=2.17",
    "mypy>=1.0",
]

[project.scripts]
dspy-openspec = "dspy_openspec.cli:main"
dspy-memory = "dspy_openspec.memory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dspy_openspec*"]

[tool.black]
line-length = 80
target-version = ["py310", "py311", "py312"]

[tool.pylint.messages_control]
max-line-length = 80
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring
    "R0913",  # Too many arguments
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
dspy = { path = "../dspy", editable = true }
