# DSPy OpenSpec Configuration

# Language Model Configuration
lm:
  # Default model (can be overridden via CLI)
  default_model: "openai/gpt-4"
  
  # Alternative models
  models:
    - "openai/gpt-4"
    - "openai/gpt-4-turbo"
    - "iflow/qwen3-coder-plus"
    - "github_copilot/gpt-5-mini"
  
  # Model parameters
  temperature: 0.7
  max_tokens: 4096

# OpenSpec Configuration
openspec:
  # Memory documents directory
  memory_dir: "openspec-memories"
  
  # Specs directory
  specs_dir: "specs"
  
  # Changes directory
  changes_dir: "openspec/changes"
  
  # Validation settings
  validation:
    strict: true
    coverage_threshold: 0.6  # 60% requirement coverage

# DSPy Optimization Configuration
optimization:
  # Enable optimization
  enabled: false
  
  # Optimizer to use (bootstrap, mipro, copro)
  optimizer: "bootstrap"
  
  # Training dataset path
  trainset_path: null
  
  # Metric for optimization
  metric: "proposal_quality"
  
  # Bootstrap settings
  bootstrap:
    max_bootstrapped_demos: 4
    max_labeled_demos: 16
  
  # MIPRO settings
  mipro:
    num_candidates: 10
    init_temperature: 1.0

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
