openapi: 3.0.0
info:
  title: Simics Watchdog Timer Register Access API
  description: Register access contracts for the Simics Watchdog Timer device
  version: 1.0.0

paths:
  /registers/WDOGLOAD:
    get:
      summary: Read WDOGLOAD register
      description: Read the 32-bit load value register
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: integer
                    format: uint32
                    description: Current load value
        '403':
          description: Register access forbidden (locked)
    put:
      summary: Write WDOGLOAD register
      description: Write the 32-bit load value register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: integer
                  format: uint32
                  description: Load value to set
                  minimum: 0
                  maximum: 4294967295
      responses:
        '200':
          description: Successful write
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGVALUE:
    get:
      summary: Read WDOGVALUE register
      description: Read the 32-bit current counter value register
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: integer
                    format: uint32
                    description: Current counter value
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGCONTROL:
    get:
      summary: Read WDOGCONTROL register
      description: Read the control register with interrupt and reset enable bits
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  int_en:
                    type: boolean
                    description: Interrupt enable bit
                  res_en:
                    type: boolean
                    description: Reset enable bit
        '403':
          description: Register access forbidden (locked)
    put:
      summary: Write WDOGCONTROL register
      description: Write the control register with interrupt and reset enable bits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                int_en:
                  type: boolean
                  description: Interrupt enable bit
                res_en:
                  type: boolean
                  description: Reset enable bit
      responses:
        '200':
          description: Successful write
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGINTCLR:
    put:
      summary: Write WDOGINTCLR register
      description: Write to the interrupt clear register to clear pending interrupt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clear:
                  type: boolean
                  description: Clear interrupt (any write clears)
      responses:
        '200':
          description: Successful write
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGRIS:
    get:
      summary: Read WDOGRIS register
      description: Read the raw interrupt status register
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    description: Raw interrupt status
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGMIS:
    get:
      summary: Read WDOGMIS register
      description: Read the masked interrupt status register
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    description: Masked interrupt status (interrupt enabled and pending)
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGLOCK:
    get:
      summary: Read WDOGLOCK register
      description: Read the register lock status
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  locked:
                    type: boolean
                    description: Lock status (true = locked)
    put:
      summary: Write WDOGLOCK register
      description: Write to the lock register to lock/unlock other registers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                unlock_key:
                  type: integer
                  format: uint32
                  description: Unlock key (0x1ACCE551 to unlock, any other value to lock)
      responses:
        '200':
          description: Successful write

  /registers/WDOGITCR:
    get:
      summary: Read WDOGITCR register
      description: Read the integration test control register
      responses:
        '200':
          description: Successful read
          content:
            application/json:
              schema:
                type: object
                properties:
                  test_mode:
                    type: boolean
                    description: Integration test mode enabled
        '403':
          description: Register access forbidden (locked)
    put:
      summary: Write WDOGITCR register
      description: Write the integration test control register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                test_mode:
                  type: boolean
                  description: Enable integration test mode
      responses:
        '200':
          description: Successful write
        '403':
          description: Register access forbidden (locked)

  /registers/WDOGITOP:
    put:
      summary: Write WDOGITOP register
      description: Write the integration test output set register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                int_output:
                  type: boolean
                  description: Set interrupt output directly
                res_output:
                  type: boolean
                  description: Set reset output directly
      responses:
        '200':
          description: Successful write
        '403':
          description: Register access forbidden (locked)

components:
  schemas:
    RegisterValue:
      type: object
      properties:
        value:
          type: integer
          format: uint32
    ControlRegister:
      type: object
      properties:
        int_en:
          type: boolean
        res_en:
          type: boolean
    LockRegister:
      type: object
      properties:
        unlock_key:
          type: integer
          format: uint32
    TestControlRegister:
      type: object
      properties:
        test_mode:
          type: boolean
    TestOutputRegister:
      type: object
      properties:
        int_output:
          type: boolean
        res_output:
          type: boolean